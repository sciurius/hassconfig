# Slaapkamer                -*- hass -*-

template:

  sensor:

    - name: "Slaapkamer Warmtedeken UI"
      unique_id: slaapkamer_warmtedeken_ui
      state: >
        {% if states('sensor.slaapkamer_warmtedeken_energy_power')|float(0) < 5 %}
        Uit
        {% elif states('sensor.slaapkamer_warmtedeken_energy_power')|float(0) < 25 %}
        Laag
        {% elif states('sensor.slaapkamer_warmtedeken_energy_power')|float(0) < 40 %}
        Medium
        {% else %}
        Hoog
        {% endif %}

timer:

  slaapkamer_warmtedeken:
    duration: "01:00:00"
    restore: true

automation:

  # - id: Automation__Switch_Off_Warmtedeken
  #   description: "Switch off warmtedeken after 1 hour."
