# ttree config

# Directories.
src  = /home/jv/src/hassconf/src
lib  = /home/jv/src/hassconf/lib
lib  = /home/jv/src/hassconf/lib/tt
lib  = /home/jv/src/hassconf/lib/tt/ui

dest = /home/jv/src/hassconf/yaml

suffix tt=yaml

# Copy images and other non-eligible files.
copy = \.(yaml)$

# Ignore CVS, RCS, and Emacs temporary files.
ignore = \b(CVS|RCS|_darcs)\b
ignore = ^#
ignore = (^|/)\.(?!htaccess)
ignore = .*makefile.*
ignore = ~$
ignore = \.(ttx|yamlx|md|pl|plx)$

define sections cards

# Misc options.
absolute
verbose
recurse
recursion

# TT options.
pre_process = yaml/main

# Templates encoding, 21st century style.
encoding = utf8
binmode = utf8
